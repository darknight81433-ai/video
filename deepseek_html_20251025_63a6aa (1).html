<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .url-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .url-input:focus {
            border-color: #ff416c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 65, 108, 0.2);
        }

        .btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-container {
            margin-top: 30px;
            display: none;
        }

        .video-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        .thumbnail {
            flex: 1;
            min-width: 300px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .thumbnail img {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-details {
            flex: 2;
            min-width: 300px;
        }

        .video-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #333;
        }

        .video-meta {
            color: #666;
            margin-bottom: 15px;
        }

        .download-options {
            background-color: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .download-options h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .format-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .format-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .format-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .format-type {
            font-weight: 600;
            color: #ff416c;
            margin-bottom: 5px;
        }

        .format-quality {
            color: #666;
            margin-bottom: 10px;
        }

        .download-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        .download-btn:hover {
            background: #45a049;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ff416c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background-color: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .success-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .video-info {
                flex-direction: column;
            }
            
            .thumbnail, .video-details {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>YouTube Video Downloader</h1>
            <p>Paste a YouTube URL to download videos in various formats</p>
        </div>
        
        <div class="content">
            <div class="input-group">
                <label for="youtube-url">YouTube Video URL</label>
                <input type="text" id="youtube-url" class="url-input" placeholder="https://www.youtube.com/watch?v=..." />
            </div>
            
            <button id="fetch-btn" class="btn">Fetch Video Information</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Fetching video information...</p>
            </div>
            
            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>
            
            <div class="result-container" id="result-container">
                <div class="video-info">
                    <div class="thumbnail">
                        <img id="video-thumbnail" src="" alt="Video Thumbnail" />
                    </div>
                    <div class="video-details">
                        <h2 id="video-title" class="video-title">Video Title</h2>
                        <div id="video-meta" class="video-meta"></div>
                    </div>
                </div>
                
                <div class="download-options">
                    <h3>Download Options</h3>
                    <div class="format-list" id="format-list">
                        <!-- Format options will be added here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const youtubeUrlInput = document.getElementById('youtube-url');
            const fetchBtn = document.getElementById('fetch-btn');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            const videoThumbnail = document.getElementById('video-thumbnail');
            const videoTitle = document.getElementById('video-title');
            const videoMeta = document.getElementById('video-meta');
            const formatList = document.getElementById('format-list');
            
            // Extract video ID from YouTube URL
            function getYouTubeVideoId(url) {
                const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[7].length === 11) ? match[7] : null;
            }
            
            // Show thumbnail when URL is pasted
            youtubeUrlInput.addEventListener('input', function() {
                const url = this.value.trim();
                const videoId = getYouTubeVideoId(url);
                
                if (videoId) {
                    // Show thumbnail preview
                    videoThumbnail.src = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                    videoThumbnail.onerror = function() {
                        // Fallback to lower quality thumbnail if maxres doesn't exist
                        this.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                    };
                }
            });
            
            // Fetch video information
            fetchBtn.addEventListener('click', function() {
                const url = youtubeUrlInput.value.trim();
                const videoId = getYouTubeVideoId(url);
                
                if (!url) {
                    showError('Please enter a YouTube URL');
                    return;
                }
                
                if (!videoId) {
                    showError('Please enter a valid YouTube URL');
                    return;
                }
                
                // Show loading state
                loading.style.display = 'block';
                resultContainer.style.display = 'none';
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
                fetchBtn.disabled = true;
                
                // In a real implementation, you would call the API here
                // For demonstration, we'll simulate the API response
                setTimeout(() => {
                    simulateApiResponse(videoId, url);
                }, 1500);
            });
            
            // Simulate API response (replace with actual API call)
            function simulateApiResponse(videoId, url) {
                // This is a simulation - in a real app, you would call the RapidAPI
                const mockResponse = {
                    success: true,
                    title: 'Sample YouTube Video Title',
                    duration: '10:30',
                    thumbnail: `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`,
                    formats: [
                        { type: 'MP4', quality: '1080p', size: '125 MB', url: '#' },
                        { type: 'MP4', quality: '720p', size: '85 MB', url: '#' },
                        { type: 'MP4', quality: '480p', size: '45 MB', url: '#' },
                        { type: 'MP3', quality: '128 kbps', size: '12 MB', url: '#' },
                        { type: 'MP3', quality: '320 kbps', size: '28 MB', url: '#' }
                    ]
                };
                
                loading.style.display = 'none';
                fetchBtn.disabled = false;
                
                if (mockResponse.success) {
                    displayVideoInfo(mockResponse);
                    showSuccess('Video information fetched successfully!');
                } else {
                    showError('Failed to fetch video information. Please try again.');
                }
            }
            
            // Display video information
            function displayVideoInfo(data) {
                videoTitle.textContent = data.title;
                videoMeta.textContent = `Duration: ${data.duration}`;
                videoThumbnail.src = data.thumbnail;
                
                // Clear previous format list
                formatList.innerHTML = '';
                
                // Add format options
                data.formats.forEach(format => {
                    const formatItem = document.createElement('div');
                    formatItem.className = 'format-item';
                    
                    formatItem.innerHTML = `
                        <div class="format-type">${format.type}</div>
                        <div class="format-quality">${format.quality}</div>
                        <div class="format-size">${format.size}</div>
                        <button class="download-btn" data-url="${format.url}">Download</button>
                    `;
                    
                    formatList.appendChild(formatItem);
                });
                
                resultContainer.style.display = 'block';
            }
            
            // Show error message
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                loading.style.display = 'none';
                fetchBtn.disabled = false;
            }
            
            // Show success message
            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
            }
            
            // Handle download button clicks
            formatList.addEventListener('click', function(e) {
                if (e.target.classList.contains('download-btn')) {
                    const url = e.target.getAttribute('data-url');
                    // In a real implementation, this would initiate the download
                    alert('Download functionality would be implemented here. In a real app, this would download the video.');
                }
            });
        });
    </script>
</body>
</html>
